  <body>
    <div id="toasts" aria-live="polite"></div>
    <div id="view-home">
      <header class="appbar">
        <div class="appbar-in">
          <h1 class="apptitle"><b>Run</b></h1>
          <button class="iconbtn" id="btn-theme" aria-label="Theme">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          </button>
          <button class="iconbtn" id="btn-menu-home" aria-label="More">
            <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="12" cy="19" r="1.9"/></svg>
          </button>
        </div>
      </header>
      <main class="wrap">
        <h2 class="section-title"><span data-i18n="activeRooms">My active rooms</span> <small id="active-count"></small></h2>
        <div class="roomlist" id="rooms-active"></div>
        <div class="empty hidden" id="rooms-empty">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
          <b data-i18n="emptyActiveT">No rooms yet</b>
        </div>
        <h2 class="section-title"><span data-i18n="archiveTitle">Archive</span></h2>
        <div class="roomlist" id="rooms-archived"></div>
        <div class="empty hidden" id="archived-empty">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8v13H3V8"/><path d="M1 3h22v5H1z"/><path d="M10 12h4"/></svg>
          <b data-i18n="emptyArchT">Archive is empty</b>
        </div>
      </main>
      <button class="fab" id="btn-create" aria-label="New room">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <input type="file" id="import-file" accept="application/json,.json" class="hidden" />
    </div>
    <div id="view-room" class="hidden">
      <header class="appbar">
        <div class="appbar-in">
          <button class="iconbtn" id="btn-back" aria-label="Back" data-i18n-aria="back">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M11 18l-6-6 6-6"/></svg>
          </button>
          <div class="col">
            <h1 class="apptitle" id="room-title" style="padding:0">Room</h1>
            <div class="presence">
              <span class="dot" id="conn-dot"></span>
              <span id="conn-text">Connecting…</span>
              <span class="names" id="presence-names"></span>
            </div>
          </div>
          <button class="iconbtn" id="btn-theme-room" aria-label="Theme">
