<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>Run — your rooms, no server</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Tajawal:wght@400;500;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
    <style>
      :root{
        color-scheme: light;
        --bg:#f8fafd;
        --surface:#ffffff;
        --surface-2:#edf2f7;
        --surface-3:#dfe7f0;
        --ink:#191c20;
        --ink-2:#44474e;
        --ink-3:#74777f;
        --line:#d9dee6;
        --accent:#0b57d0;
        --accent-strong:#0842a0;
        --accent-soft:#d3e3fd;
        --on-accent:#ffffff;
        --amber:#7a5901;
        --amber-soft:#f7e7bd;
        --danger:#b3261e;
        --danger-soft:#f9dedc;
        --bubble-me:#0b57d0;
        --bubble-me-ink:#ffffff;
        --bubble-other:#edf2f7;
        --snack-bg:#191c20;
        --snack-ink:#f2f2f2;
        --shadow:0 1px 2px rgba(25,28,32,.14),0 1px 6px rgba(25,28,32,.10);
        --shadow-lg:0 4px 8px rgba(25,28,32,.16),0 8px 24px rgba(25,28,32,.14);
        --radius:16px;
      }
      :root[data-theme="dark"]{
        color-scheme: dark;
        --bg:#0f1113;
        --surface:#191c20;
        --surface-2:#22262b;
        --surface-3:#2e3339;
        --ink:#e2e2e6;
        --ink-2:#c4c7cf;
        --ink-3:#8f9299;
        --line:#33373d;
        --accent:#a8c7fa;
        --accent-strong:#d3e3fd;
        --accent-soft:#004a77;
        --on-accent:#0a305f;
        --amber:#eac446;
        --amber-soft:#4a3a08;
        --danger:#f2b8b5;
        --danger-soft:#410e0b;
        --bubble-me:#004a77;
        --bubble-me-ink:#d3e3fd;
        --bubble-other:#22262b;
        --snack-bg:#e2e2e6;
        --snack-ink:#191c20;
        --shadow:0 1px 2px rgba(0,0,0,.5),0 1px 6px rgba(0,0,0,.4);
        --shadow-lg:0 4px 8px rgba(0,0,0,.55),0 8px 24px rgba(0,0,0,.5);
      }
      @media (prefers-color-scheme: dark){
        :root:not([data-theme="light"]){
          color-scheme: dark;
          --bg:#0f1113;
          --surface:#191c20;
          --surface-2:#22262b;
          --surface-3:#2e3339;
          --ink:#e2e2e6;
          --ink-2:#c4c7cf;
          --ink-3:#8f9299;
          --line:#33373d;
          --accent:#a8c7fa;
          --accent-strong:#d3e3fd;
          --accent-soft:#004a77;
          --on-accent:#0a305f;
          --amber:#eac446;
          --amber-soft:#4a3a08;
          --danger:#f2b8b5;
          --danger-soft:#410e0b;
          --bubble-me:#004a77;
          --bubble-me-ink:#d3e3fd;
          --bubble-other:#22262b;
          --snack-bg:#e2e2e6;
          --snack-ink:#191c20;
          --shadow:0 1px 2px rgba(0,0,0,.5),0 1px 6px rgba(0,0,0,.4);
          --shadow-lg:0 4px 8px rgba(0,0,0,.55),0 8px 24px rgba(0,0,0,.5);
        }
      }
      *{box-sizing:border-box}
      html{-webkit-text-size-adjust:100%}
      body{
        margin:0;background:var(--bg);color:var(--ink);
        font-family:"Roboto","Tajawal",system-ui,-apple-system,"Segoe UI",sans-serif;
        font-size:16px;line-height:1.5;
      }
      button{font-family:inherit;cursor:pointer;color:inherit}
      input,textarea,select{font-family:inherit;font-size:16px;color:var(--ink)}
      :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
      .wrap{max-width:860px;margin:0 auto;padding:8px 16px 110px}
      .icon{width:22px;height:22px;flex:none}
      .hidden{display:none !important}

      /* ---------- app bar ---------- */
      .appbar{position:sticky;top:0;z-index:40;background:var(--bg)}
      .appbar-in{max-width:860px;margin:0 auto;padding:6px 8px;display:flex;align-items:center;gap:2px;min-height:56px}
      .apptitle{font-size:21px;font-weight:500;margin:0;padding-inline-start:10px;flex:1;min-width:0;
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      .apptitle b{color:var(--accent);font-weight:700}
      .appsub{padding:0 10px 6px;font-size:13px;color:var(--ink-2);display:flex;align-items:center;gap:7px;flex-wrap:wrap}
      .appbar .col{flex:1;min-width:0}
      .iconbtn{border:none;background:transparent;border-radius:50%;width:42px;height:42px;flex:none;
        display:inline-flex;align-items:center;justify-content:center;color:var(--ink-2)}
      .iconbtn:active{background:var(--surface-2)}
      .iconbtn .icon{width:23px;height:23px}
      html[dir="rtl"] #btn-back .icon{transform:scaleX(-1)}

      /* ---------- buttons ---------- */
      .btn{
        border:none;background:var(--surface-2);color:var(--ink);
        border-radius:999px;padding:10px 20px;font-size:14.5px;font-weight:500;
        display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;
      }
      .btn:active{filter:brightness(.96)}
      .btn.primary{background:var(--accent);color:var(--on-accent)}
      .btn.textbtn{background:transparent;color:var(--accent);padding:10px 14px}
      .btn.danger{background:var(--danger);color:#fff}
      .btn.textdanger{background:transparent;color:var(--danger)}
      .btn:disabled{opacity:.5;cursor:not-allowed}
      .btn .icon{width:19px;height:19px}
      .fab{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom));inset-inline-end:20px;z-index:45;
        width:56px;height:56px;border:none;border-radius:18px;background:var(--accent);color:var(--on-accent);
        box-shadow:var(--shadow-lg);display:flex;align-items:center;justify-content:center}
      .fab .icon{width:26px;height:26px}
      .fab:active{filter:brightness(.94)}

      /* ---------- overflow menu ---------- */
      .menu{position:fixed;z-index:90;background:var(--surface);border-radius:12px;box-shadow:var(--shadow-lg);
        padding:6px;min-width:228px;max-width:calc(100vw - 24px);animation:tin .15s ease}
      .menu.measuring{visibility:hidden}
      .menu-item{display:flex;align-items:center;gap:13px;width:100%;border:none;background:transparent;
        padding:11px 12px;border-radius:8px;font-size:15px;font-weight:400;color:var(--ink);text-align:start}
      .menu-item:active{background:var(--surface-2)}
      .menu-item .icon{width:21px;height:21px;color:var(--ink-2)}
      .menu-item.danger{color:var(--danger)}
      .menu-item.danger .icon{color:var(--danger)}

      /* ---------- sections & room list ---------- */
      .section-title{font-size:14px;font-weight:500;color:var(--ink-2);margin:22px 4px 6px;
        display:flex;align-items:center;gap:8px;letter-spacing:.02em}
      .section-title small{color:var(--ink-3);font-weight:400}
      .roomlist{display:flex;flex-direction:column}
      .roomrow{display:flex;align-items:center;gap:2px;border-radius:14px;padding:4px 2px}
      .roomrow:active{background:var(--surface-2)}
      .roomrow-main{flex:1;min-width:0;display:flex;align-items:center;gap:13px;border:none;background:transparent;
        padding:9px 8px;text-align:start;border-radius:14px;color:var(--ink)}
      .roomrow.archived .roomrow-main{opacity:.65}
      .avatar{width:46px;height:46px;border-radius:50%;background:var(--accent-soft);color:var(--accent);
        display:flex;align-items:center;justify-content:center;font-weight:500;font-size:19px;flex:none}
      :root[data-theme="dark"] .avatar{color:var(--accent-strong)}
      @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .avatar{color:var(--accent-strong)} }
      .rr-text{flex:1;min-width:0}
      .rr-text b{display:block;font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      .rr-text small{display:block;color:var(--ink-3);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      .rr-text small .code{font-family:"Space Mono",monospace;font-size:12.5px}
      .chip{font-size:11.5px;font-weight:500;border-radius:7px;padding:2px 8px;background:var(--accent-soft);color:var(--accent);white-space:nowrap;flex:none}
      :root[data-theme="dark"] .chip{color:var(--accent-strong)}
      @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .chip{color:var(--accent-strong)} }
      .chip.amber{background:var(--amber-soft);color:var(--amber)}
      .empty{padding:52px 20px;text-align:center;color:var(--ink-3)}
      .empty .icon{width:52px;height:52px;color:var(--surface-3);margin-bottom:8px}
      .empty b{color:var(--ink-2);font-size:16px;font-weight:500;display:block}

      /* ---------- room header ---------- */
      .presence{font-size:13px;color:var(--ink-2);display:flex;align-items:center;gap:7px;flex-wrap:wrap}
      .presence .names{color:var(--ink-3)}
      .dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3);display:inline-block;flex:none}
      .dot.on{background:#34a853}
      .coderow{display:flex;align-items:center;gap:4px;padding:0 10px 8px}
      .coderow .code{font-family:"Space Mono",monospace;font-size:14px;letter-spacing:1px;color:var(--ink-2);direction:ltr}
      .coderow .iconbtn{width:34px;height:34px}
      .coderow .iconbtn .icon{width:18px;height:18px}
      .archived-banner{background:var(--amber-soft);color:var(--amber);border-radius:12px;
        padding:9px 8px 9px 14px;font-size:14px;margin:10px 0 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
      html[dir="rtl"] .archived-banner{padding:9px 14px 9px 8px}
      .archived-banner span{flex:1}
      .archived-banner .btn{min-height:36px;padding:6px 14px;background:transparent;color:var(--amber);border:1px solid var(--amber)}

      /* ---------- tabs ---------- */
      .tabs{display:flex;border-bottom:1px solid var(--line);margin:2px -8px 0;padding:0 8px}
      .tabs button{flex:1;border:none;background:transparent;padding:12px 4px 10px;position:relative;
        font-size:14.5px;font-weight:500;color:var(--ink-2)}
      .tabs button.active{color:var(--accent)}
      .tabs button.active::after{content:"";position:absolute;bottom:-1px;inset-inline:18%;
        height:3px;border-radius:3px 3px 0 0;background:var(--accent)}
      .tabs button .cnt{background:var(--accent);color:var(--on-accent);border-radius:999px;font-size:11px;
        padding:0 6px;margin-inline-start:6px;vertical-align:2px}

      /* ---------- chat ---------- */
      .chatlog{display:flex;flex-direction:column;gap:4px;padding:16px 0 10px;min-height:200px}
      .msg{max-width:85%;padding:9px 13px 7px;border-radius:20px;background:var(--bubble-other);color:var(--ink);
        align-self:flex-start;border-end-start-radius:6px;word-break:break-word;position:relative;margin-top:4px}
      .msg.me{align-self:flex-end;background:var(--bubble-me);color:var(--bubble-me-ink);
        border-end-start-radius:20px;border-end-end-radius:6px}
      .msg .author{font-size:12.5px;font-weight:500;color:var(--accent);margin-bottom:1px}
      .msg.me .author{color:inherit;opacity:.85}
      .msg .time{font-size:11px;opacity:.6;margin-top:3px;text-align:end}
      .msg .text{white-space:pre-wrap}
      .msg.system{align-self:center;background:var(--surface-2);color:var(--ink-2);font-size:12.5px;
        padding:4px 12px;border-radius:999px;max-width:92%;text-align:center}
      .filebox{display:flex;align-items:center;gap:10px;background:rgba(127,140,160,.14);border-radius:12px;padding:8px 10px;margin-top:6px}
      .filebox .fi{width:38px;height:38px;border-radius:50%;background:var(--danger-soft);color:var(--danger);
        display:flex;align-items:center;justify-content:center;font-weight:700;font-size:10.5px;flex:none}
      .filebox .fi.img{background:var(--accent-soft);color:var(--accent)}
      .filebox .fn{flex:1;min-width:0}
      .filebox .fn b{display:block;font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      .filebox .fn small{opacity:.65;font-size:12px}
      .filebox a.dl{color:var(--accent);display:inline-flex;padding:7px;border-radius:50%}
      .msg.me .filebox a.dl{color:inherit}
      .filebox a.dl .icon{width:21px;height:21px}
      .filebox .nodl{font-size:12px;opacity:.65;padding-inline-end:4px}

      /* ---------- composer (full width) ---------- */
      .composer{position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--bg);
        padding:6px 10px calc(8px + env(safe-area-inset-bottom))}
      .composer-in{max-width:860px;margin:0 auto}
      .composer .box{display:flex;gap:6px;align-items:flex-end}
      .composer .field{flex:1;display:flex;align-items:flex-end;background:var(--surface-2);border-radius:26px;padding:3px 6px 3px 16px}
      html[dir="rtl"] .composer .field{padding:3px 16px 3px 6px}
      .composer textarea{flex:1;border:none;background:transparent;resize:none;max-height:110px;
        padding:9px 0;outline:none;line-height:1.4}
      .composer textarea::placeholder{color:var(--ink-3)}
      .attachbtn{border:none;background:transparent;border-radius:50%;width:40px;height:40px;flex:none;
        display:flex;align-items:center;justify-content:center;color:var(--ink-2)}
      .attachbtn:active{background:var(--surface-3)}
      .sendbtn{border:none;border-radius:50%;width:46px;height:46px;flex:none;background:var(--accent);color:var(--on-accent);
        display:flex;align-items:center;justify-content:center}
      .sendbtn .icon{width:21px;height:21px}
      html[dir="rtl"] .sendbtn .icon{transform:scaleX(-1)}
      .pendingfile{display:none;align-items:center;gap:8px;background:var(--accent-soft);color:var(--accent);
        border-radius:12px;padding:7px 8px 7px 13px;font-size:13.5px;font-weight:500;margin-bottom:7px}
      html[dir="rtl"] .pendingfile{padding:7px 13px 7px 8px}
      :root[data-theme="dark"] .pendingfile{color:var(--accent-strong)}
      @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .pendingfile{color:var(--accent-strong)} }
      .pendingfile.show{display:flex}
      .pendingfile span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      .pendingfile button{border:none;background:transparent;color:inherit;display:flex;padding:5px}

      /* ---------- pinned ---------- */
      .pinbtn{position:absolute;top:4px;inset-inline-end:4px;width:28px;height:28px;border:none;border-radius:50%;
        background:transparent;color:var(--ink-3);display:flex;align-items:center;justify-content:center;
        opacity:.45;transition:opacity .15s;padding:0}
      .msg:hover .pinbtn,.msg:focus-within .pinbtn{opacity:.9}
      .pinbtn svg{width:15px;height:15px}
      .pinbtn.on{opacity:1;color:var(--amber)}
      .msg.me .pinbtn{color:rgba(255,255,255,.7)}
      .msg.me .pinbtn.on{color:#ffd58a}
      @media (hover:none){.pinbtn{opacity:.5}.pinbtn.on{opacity:1}}
      .msg.flash{animation:msgflash 1.8s ease}
      @keyframes msgflash{0%,55%{box-shadow:0 0 0 3px var(--amber)}100%{box-shadow:none}}
      .pinnedbar{background:var(--surface-2);border-radius:14px;padding:8px 10px;margin-top:12px}
      .pinnedbar .phead{display:flex;align-items:center;gap:7px;font-weight:500;font-size:13px;color:var(--ink-2)}
      .pinnedbar .phead svg{width:15px;height:15px;color:var(--amber)}
      .pinnedbar .phead .cnt{background:var(--amber);color:#fff;border-radius:999px;font-size:11px;padding:0 7px}
      .pinitem{display:flex;align-items:center;gap:9px;background:var(--surface);border-radius:10px;
        padding:8px 11px;margin-top:6px;cursor:pointer;width:100%;color:var(--ink);border:none;text-align:start;font-size:14px}
      .pinitem .pa{font-weight:500;font-size:13px;color:var(--accent);flex:none}
      .pinitem .pt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
      .pinitem .unpin{border:none;background:transparent;color:var(--ink-3);border-radius:50%;width:30px;height:30px;
        display:flex;align-items:center;justify-content:center;flex:none;padding:0}
      .pinitem .unpin svg{width:16px;height:16px}

      /* ---------- tasks ---------- */
      .taskcard{display:flex;gap:6px;align-items:flex-start;background:var(--surface);border-radius:14px;
        padding:10px 8px 10px 12px;margin-top:8px;box-shadow:var(--shadow)}
      html[dir="rtl"] .taskcard{padding:10px 12px 10px 8px}
      .taskcard .info{flex:1;min-width:0;padding-top:5px}
      .taskcard .info b{font-size:15.5px;font-weight:500}
      .taskcard .info p{margin:2px 0 0;color:var(--ink-2);font-size:14px;white-space:pre-wrap}
      .taskcard .due{font-size:12.5px;color:var(--amber);font-weight:500;margin-top:4px}
      .taskcard .by{font-size:12px;color:var(--ink-3);margin-top:3px}
      .taskcard.done .info b,.taskcard.done .info p{text-decoration:line-through;opacity:.55}
      .donebtn{border:1.8px solid var(--ink-3);background:transparent;border-radius:50%;
        width:26px;height:26px;flex:none;display:flex;align-items:center;justify-content:center;color:transparent;margin-top:4px;padding:0}
      .donebtn svg{width:16px;height:16px}
      .donebtn.isdone{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
      .delbtn{border:none;background:transparent;color:var(--ink-3);border-radius:50%;width:34px;height:34px;
        display:flex;align-items:center;justify-content:center;flex:none;padding:0}
      .delbtn .icon{width:19px;height:19px}
      .mini-form{margin-top:20px}
      .mini-form h4{margin:0 0 10px;font-size:15px;font-weight:500}

      /* ---------- fields & dialogs ---------- */
      .field{margin-bottom:14px}
      .field label{display:block;font-weight:500;font-size:13.5px;color:var(--ink-2);margin-bottom:6px}
      .field input,.field select,.field textarea,.mini-form input,.mini-form textarea{
        width:100%;border:none;background:var(--surface-2);border-radius:12px;padding:12px 14px;outline:none}
      .field input:focus,.field select:focus,.field textarea:focus,.mini-form input:focus,.mini-form textarea:focus{
        box-shadow:inset 0 0 0 2px var(--accent)}
      .field input.codeinput{font-family:"Space Mono",monospace;direction:ltr;text-align:center;font-size:19px;letter-spacing:2px;text-transform:uppercase}
      .mini-form textarea,.field textarea{resize:vertical;min-height:60px}
      .mini-form input,.mini-form textarea{margin-bottom:9px}
      .overlay{position:fixed;inset:0;background:rgba(10,12,16,.5);display:none;align-items:flex-end;justify-content:center;z-index:60}
      .overlay.show{display:flex}
      @media(min-width:640px){.overlay{align-items:center;padding:20px}}
      .sheet{background:var(--surface);width:100%;max-width:460px;border-radius:28px 28px 0 0;
        padding:24px 22px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:tin .18s ease}
      @media(min-width:640px){.sheet{border-radius:28px}}
      .sheet h3{margin:0 0 16px;font-size:19px;font-weight:500}
      .sheet .sub{color:var(--ink-2);font-size:14.5px;margin:-8px 0 16px}
      .sheet .row{display:flex;gap:8px;margin-top:10px;justify-content:flex-end}
      .profilerow{display:flex;align-items:center;gap:13px;margin-bottom:18px}
      .profilerow input{flex:1;border:none;background:var(--surface-2);border-radius:12px;padding:12px 14px;outline:none;min-width:0}
      .profilerow input:focus{box-shadow:inset 0 0 0 2px var(--accent)}
      .seg{display:flex;gap:0;border:1px solid var(--line);border-radius:999px;overflow:hidden}
      .seg button{flex:1;border:none;background:transparent;padding:9px 4px;font-size:14px;font-weight:500;color:var(--ink-2)}
      .seg button + button{border-inline-start:1px solid var(--line)}
      .seg button.active{background:var(--accent-soft);color:var(--accent)}
      :root[data-theme="dark"] .seg button.active{color:var(--accent-strong)}
      @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .seg button.active{color:var(--accent-strong)} }

      /* ---------- snackbar ---------- */
      #toasts{position:fixed;bottom:calc(96px + env(safe-area-inset-bottom));left:0;right:0;z-index:80;
        display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
      .toast{background:var(--snack-bg);color:var(--snack-ink);border-radius:12px;padding:12px 18px;
        font-size:14px;box-shadow:var(--shadow-lg);animation:tin .25s ease;max-width:520px;text-align:center}
      @keyframes tin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

      /* ---------- desktop ---------- */
      @media (min-width:1024px){
        .msg{max-width:70%}
        .appbar-in{padding:8px}
      }
    </style>
  </head>
  <body>
    <div id="toasts" aria-live="polite"></div>

    <!-- ================= HOME ================= -->
    <div id="view-home">
      <header class="appbar">
        <div class="appbar-in">
          <h1 class="apptitle"><b>Run</b></h1>
          <button class="iconbtn" id="btn-theme" aria-label="Theme">

      return "id-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10);

    function esc(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }
    function fmtTime(ts) {
      var loc = LOCALES[state.lang] || "ar";

      var today = new Date();
      var sameDay = d.toDateString() === today.toDateString();
      var t = d.toLocaleTimeString(loc, { hour: "2-digit", minute: "2-digit" });
      return sameDay ? t : d.toLocaleDateString(loc, { day: "numeric", month: "short" }) + " · " + t;
    }
    function fmtSize(n) {
      if (n < 1024) return n + " " + t("sizeB");
      if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " " + t("sizeKB");

    /* ---------------- IndexedDB ---------------- */
    var DB_NAME = "run-app-db", DB_VER = 1, db = null;
    function openDB() {
      return new Promise(function (resolve, reject) {
        var req = indexedDB.open(DB_NAME, DB_VER);
        req.onupgradeneeded = function () {
          var d = req.result;
          if (!d.objectStoreNames.contains("rooms")) d.createObjectStore("rooms", { keyPath: "id" });
          if (!d.objectStoreNames.contains("messages")) {
            var ms = d.createObjectStore("messages", { keyPath: "id" });
            ms.createIndex("roomId", "roomId", { unique: false });
          }
          if (!d.objectStoreNames.contains("tasks")) {
            var ts = d.createObjectStore("tasks", { keyPath: "id" });
            ts.createIndex("roomId", "roomId", { unique: false });
          }
          if (!d.objectStoreNames.contains("files")) d.createObjectStore("files", { keyPath: "id" });
          if (!d.objectStoreNames.contains("meta")) d.createObjectStore("meta", { keyPath: "key" });
        };
        req.onsuccess = function () { db = req.result; resolve(db); };
        req.onerror = function () { reject(req.error); };
      });
    }
    function tx(store, mode) { return db.transaction(store, mode).objectStore(store); }
    function idbPut(store, val) {
      return new Promise(function (res, rej) {
        var r = tx(store, "readwrite").put(val);
        r.onsuccess = function () { res(val); };
        r.onerror = function () { rej(r.error); };
      });
    }
    function idbGet(store, key) {
      return new Promise(function (res, rej) {
        var r = tx(store, "readonly").get(key);
        r.onsuccess = function () { res(r.result || null); };
        r.onerror = function () { rej(r.error); };
      });
    }
    function idbAll(store) {
      return new Promise(function (res, rej) {
        var r = tx(store, "readonly").getAll();
        r.onsuccess = function () { res(r.result || []); };
        r.onerror = function () { rej(r.error); };
      });
    }
    function idbDel(store, key) {
      return new Promise(function (res, rej) {
        var r = tx(store, "readwrite").delete(key);
        r.onsuccess = function () { res(); };
        r.onerror = function () { rej(r.error); };
      });
    }
    function idbByRoom(store, roomId) {
      return new Promise(function (res, rej) {
        var out = [], idx = tx(store, "readonly").index("roomId");
        var r = idx.openCursor(IDBKeyRange.only(roomId));
        r.onsuccess = function () {
          var c = r.result;
          if (c) { out.push(c.value); c.continue(); } else res(out);
        };
        r.onerror = function () { rej(r.error); };
      });
    }
    function blobToDataURL(blob) {
      return new Promise(function (res, rej) {
        var fr = new FileReader();
        fr.onload = function () { res(fr.result); };
        fr.onerror = function () { rej(fr.error); };
        fr.readAsDataURL(blob);
      });
    }
    function dataURLToBlob(durl) {
      var parts = durl.split(","), mime = (parts[0].match(/:(.*?);/) || [])[1] || "application/octet-stream";
      var bin = atob(parts[1]), arr = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      return new Blob([arr], { type: mime });
    }

    /* ---------------- تحميل البيانات ---------------- */
    function loadMeta() {

        idbGet("meta", "profile"),

      ]).then(function (res) {

        if (s) {

          state.ui.lastRoomId = u.lastRoomId || null;

          state.ui.scrolls = u.scrolls || {};

    /* ---------------- الواجهة الرئيسية ---------------- */

    function uniqueCode() {

    function joinRoomByCode(code) {

      for (var i = 0; i < state.rooms.length; i++) {
        if (state.rooms[i].code === code) {
          var found = state.rooms[i];
          if (found.archived) found.archived = false;

        }
      }
      var room = {
        id: uid(), code: code, name: t("roomDefaultName", { code: code }), purpose: "other",

        }));
      });

        return Promise.all(files.filter(function (f) { return f.roomId === room.id; })
          .map(function (f) { return idbDel("files", f.id); }));
      }));
      jobs.push(idbDel("rooms", room.id));
      return Promise.all(jobs).then(function () {

    /* ---------------- فتح الغرفة ---------------- */

      state.fileURLs = {};
      state.pendingFile = null;
      $("#pending-file").classList.remove("show");

      /* حفظ الحالة: هذه آخر غرفة مفتوحة */

      $("#view-home").classList.add("hidden");

      $("#room-code").textContent = room.code;

      setReadOnly(!!room.archived);

      /* استعادة مسودة الرسالة غير المرسلة */

    var PIN_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 3h6l-1 7 3 3H7l3-7-1-7z"/></svg>';
    function renderChat(keepScroll) {

      } else if (ev.type === "pin" && ev.msgId) {
        state.messages.forEach(function (m) {
          if (m.id === ev.msgId) { m.pinned = !!ev.pinned; idbPut("messages", m); }
        });
        renderChat(true);
      } else if (ev.type === "task-add" && ev.task) {
        state.tasks.push(ev.task);
        idbPut("tasks", ev.task);
        renderTasks(); updateBadges();
        if (ev.task.authorId !== state.myId) notify(t("notifNewTask") + room.name, ev.task.title);
      } else if (ev.type === "task-toggle" && ev.taskId) {
        state.tasks.forEach(function (t) { if (t.id === ev.taskId) { t.done = ev.done; idbPut("tasks", t); } });
        renderTasks();
      } else if (ev.type === "task-del" && ev.taskId) {
        state.tasks = state.tasks.filter(function (t) { return t.id !== ev.taskId; });
        idbDel("tasks", ev.taskId);
        renderTasks();
      }
    }

    /* ---------------- الإرسال والحفظ ---------------- */
    function saveMessage(m, fromRemote) {
      if (!state.currentRoom) return Promise.resolve();
      var exists = state.messages.some(function (x) { return x.id === m.id; });
      if (!exists) {
        state.messages.push(m);
        state.messages.sort(function (a, b) { return a.ts - b.ts; });
      }
      return idbPut("messages", m).then(function () {
        renderChat();
        if (state.currentRoom) touchRoom(state.currentRoom);
      });
    }
    function emitEvent(ev) {
      var payload = { kind: "event", event: ev };
      if (state.isHostConn) broadcast(payload);
      else sendToHost(payload);
    }
    function sendChat() {
      var room = state.currentRoom;
      if (!room || room.archived) return;
      var text = $("#chat-input").value.trim();
      var file = state.pendingFile;
      if (!text && !file) return;
      $("#chat-input").value = "";
      autoGrow($("#chat-input"));
      if (state.ui.drafts[room.id]) { delete state.ui.drafts[room.id]; saveUI(); }

      function finish(msg, fileRec) {
        saveMessage(msg, false).then(function () {
          emitEvent({ type: "chat", msg: msg });
          if (fileRec && fileRec.dataUrlForP2P) {
            var payload = { kind: "file", file: { id: fileRec.id, name: fileRec.name, mime: fileRec.mime, size: fileRec.size, data: fileRec.dataUrlForP2P } };
            if (state.isHostConn) broadcast(payload); else sendToHost(payload);
          }
        });
      }
      if (file) {
        var fid = uid();
        var rec = { id: fid, roomId: room.id, name: file.name, mime: file.type || "application/octet-stream", size: file.size, blob: file };
        idbPut("files", rec).then(function () {
          state.fileURLs[fid] = URL.createObjectURL(file);
          var msg = { id: uid(), roomId: room.id, type: "chat", author: myName(), authorId: state.myId, text: text, ts: Date.now(), fileId: fid, fileName: rec.name, fileMime: rec.mime, fileSize: rec.size };
          clearPendingFile();
          if (file.size <= 3 * 1024 * 1024) {
            blobToDataURL(file).then(function (durl) { rec.dataUrlForP2P = durl; finish(msg, rec); });
          } else {
            toast(t("toastBigFile"));
            finish(msg, null);
          }
        });
      } else {
        finish({ id: uid(), roomId: room.id, type: "chat", author: myName(), authorId: state.myId, text: text, ts: Date.now() }, null);
      }
    }
    function clearPendingFile() {
      state.pendingFile = null;
      $("#pending-file").classList.remove("show");
      $("#chat-file").value = "";
    }
    function autoGrow(ta) {
      ta.style.height = "auto";
      ta.style.height = Math.min(110, ta.scrollHeight) + "px";
    }

    /* ---------------- النسخة الاحتياطية ---------------- */
    function exportBackup() {
      return Promise.all([idbAll("rooms"), idbAll("messages"), idbAll("tasks"), idbAll("files"), idbGet("meta", "profile")])
        .then(function (res) {
          var fileJobs = res[3].map(function (f) {
            return blobToDataURL(f.blob).then(function (durl) {
              return { id: f.id, roomId: f.roomId, name: f.name, mime: f.mime, size: f.size, data: durl };
            });
          });
          return Promise.all(fileJobs).then(function (files) {
            var backup = { app: "Run", version: 1, exportedAt: new Date().toISOString(), profile: res[4], rooms: res[0], messages: res[1], tasks: res[2], files: files };
            var blob = new Blob([JSON.stringify(backup)], { type: "application/json" });
            var a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "run-backup-" + new Date().toISOString().slice(0, 10) + ".json";
            document.body.appendChild(a); a.click(); a.remove();
            setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
            toast(t("toastExportOk"));
          });
        })
        .catch(function () { toast(t("toastExportErr")); });
    }
    function importBackup(file) {
      var reader = new FileReader();
      reader.onload = function () {
        try {
          var data = JSON.parse(reader.result);
          if (!data || data.app !== "Run") { toast(t("toastNotBackup")); return; }
          var jobs = [];
          (data.rooms || []).forEach(function (r) { jobs.push(idbPut("rooms", r)); });
          (data.messages || []).forEach(function (m) { jobs.push(idbPut("messages", m)); });
          (data.tasks || []).forEach(function (t) { jobs.push(idbPut("tasks", t)); });
          (data.files || []).forEach(function (f) {
            if (f.data) jobs.push(idbPut("files", { id: f.id, roomId: f.roomId, name: f.name, mime: f.mime, size: f.size, blob: dataURLToBlob(f.data) }));
          });
          Promise.all(jobs).then(function () {
            toast(t("toastImportOk"));
            loadRooms();
          });
        } catch (e) { toast(t("toastImportErr")); }
      };
      reader.readAsText(file);
    }

    /* ---------------- روابط الدعوة ---------------- */
    function inviteLink(code) {
      var base = window.location.href.split("#")[0];
      return base + "#join=" + encodeURIComponent(code);
    }
    function copyInvite(code) {
      var link = inviteLink(code);
      function done() { toast(t("toastInviteCopied")); }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(link).then(done).catch(function () { fallback(); });
      } else fallback();
      function fallback() {
        var ta = document.createElement("textarea");
        ta.value = link; document.body.appendChild(ta); ta.select();

        ta.remove();
      }
    }
    function handleInviteHash() {
      var h = window.location.hash || "";
      var m = h.match(/join=([A-Za-z0-9\-]+)/i);
      if (!m) return false;
      var code = "";
      try { code = decodeURIComponent(m[1]).toUpperCase(); } catch (e) { return false; }
      if (!/^RUN-[A-Z0-9]{4,}$/.test(code)) return false;

    /* ---------------- مشاركة السجل مع موس ---------------- */
    function fmtFullTime(ts) {
      var loc = LOCALES[state.lang] || "ar";
      var d = new Date(ts);
      return d.toLocaleDateString(loc, { year: "numeric", month: "long", day: "numeric" }) + " · " +
        d.toLocaleTimeString(loc, { hour: "2-digit", minute: "2-digit" });
    }
    function buildShareText(room) {
      var lines = [];
      lines.push(t("shareHead", { name: room.name }));
      lines.push(t("shareCodeLine", { code: room.code, purpose: purposeLabel(room.purpose) }));
      lines.push(t("shareExportedAt") + fmtFullTime(Date.now()));
      lines.push(t("shareMsgCount") + state.messages.length);
      lines.push("========================================");
      if (!state.messages.length) lines.push(t("shareNoMsgs"));
      state.messages.forEach(function (m) {
        if (m.type === "system") { lines.push("— " + (m.text || "") + " —"); return; }
        var line = (m.pinned ? t("sharePinned") : "") + "[" + fmtFullTime(m.ts) + "] " + (m.author || t("unknownAuthor")) + ":";
        if (m.text) line += " " + m.text;
        if (m.fileId) line += " " + t("shareAttached", { name: m.fileName || t("fileFile"), size: fmtSize(m.fileSize || 0) });
        else if (!m.text) line += " " + t("shareEmpty");
        lines.push(line);
      });
      if (state.tasks.length) {
        lines.push("========================================");
        lines.push(t("shareTasksHead"));
        state.tasks.forEach(function (tk) {
          lines.push((tk.done ? "✅ " : "⬜ ") + tk.title +
            (tk.due ? " " + t("shareDue", { due: tk.due }) : "") +
            (tk.desc ? " — " + tk.desc : "") +
            t("shareBy") + (tk.author || ""));
        });
      }
      lines.push("========================================");
      lines.push(t("shareFoot"));
      return lines.join("\n");
    }
    function copyTextGeneric(text, doneMsg) {
      function done() { toast(doneMsg); }
      if (navigator.clipboard && navigator.clipboard.writeText) {

      } else fallback();
      function fallback() {
        var ta = $("#share-text");
        if (ta) { ta.removeAttribute("readonly"); ta.select(); }
        try { document.execCommand("copy"); done(); } catch (e) { toast(t("toastSelectText")); }
        if (ta) ta.setAttribute("readonly", "");
      }
    }

    var menuEl = null;
    function menuOutside(e) { if (menuEl && !menuEl.contains(e.target)) closeMenu(); }
    function closeMenu() {
      if (!menuEl) return;
      menuEl.remove(); menuEl = null;
      document.removeEventListener("click", menuOutside, true);
    }
    function showMenu(anchor, items) {
      closeMenu();
      menuEl = document.createElement("div");
      menuEl.className = "menu measuring";
      menuEl.setAttribute("role", "menu");
      items.forEach(function (it) {
        var b = document.createElement("button");
        b.className = "menu-item" + (it.danger ? " danger" : "");
        b.innerHTML = (it.icon || "") + "<span>" + esc(it.label) + "</span>";
        b.addEventListener("click", function () { closeMenu(); if (it.onClick) it.onClick(); });
        menuEl.appendChild(b);
      });
      document.body.appendChild(menuEl);
      var r = anchor.getBoundingClientRect();
      var mw = menuEl.offsetWidth, mh = menuEl.offsetHeight;
      var left = document.documentElement.dir === "rtl" ? r.left : r.right - mw;
      left = Math.max(8, Math.min(left, window.innerWidth - mw - 8));
      var top = r.bottom + 6;
      if (top + mh > window.innerHeight - 8) top = Math.max(8, r.top - mh - 6);
      menuEl.style.left = left + "px";
      menuEl.style.top = top + "px";
      menuEl.classList.remove("measuring");
      setTimeout(function () { document.addEventListener("click", menuOutside, true); }, 0);
    }
    function roomMenuItems(room) {

        if (unpinBtn) { togglePin(unpinBtn.getAttribute("data-unpin")); return; }

        if (menuBtn) {

          if (mr) showMenu(menuBtn, roomMenuItems(mr));
          return;
        }
        var btn = e.target.closest("[data-act]");
        if (btn) {
          var room = getRoom(btn.getAttribute("data-id"));
          if (room && btn.getAttribute("data-act") === "open") openRoom(room);
          return;
        }
        var doneBtn = e.target.closest("[data-task]");
        if (doneBtn) {
          var tid = doneBtn.getAttribute("data-task");
          state.tasks.forEach(function (tk) {
            if (tk.id === tid) {

              renderTasks();

        var delBtn = e.target.closest("[data-deltask]");
        if (delBtn) {
          var did = delBtn.getAttribute("data-deltask");
          state.tasks = state.tasks.filter(function (tk) { return tk.id !== did; });

      $("#btn-back").addEventListener("click", closeRoom);
      $$(".tabs button").forEach(function (b) {
        b.addEventListener("click", function () { switchTab(b.getAttribute("data-tab")); });
      });
      $("#btn-copy-code").addEventListener("click", function () {
        if (state.currentRoom) copyCode(state.currentRoom.code);
      });
      $("#btn-share-copy").addEventListener("click", function () {
        copyTextGeneric($("#share-text").value, t("toastShareCopied"));
      });
      $("#btn-share-download").addEventListener("click", function () {
        var room = state.currentRoom; if (!room) return;
        var blob = new Blob(["\ufeff" + $("#share-text").value], { type: "text/plain;charset=utf-8" });
        var a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "run-" + room.code.replace(/^RUN-/, "").toLowerCase() + "-log.txt";
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
        toast(t("toastShareDownloaded"));
      });
      $("#btn-unarchive").addEventListener("click", function () {
        var room = state.currentRoom; if (!room) return;
        room.archived = false;
        idbPut("rooms", room).then(function () { openRoom(room); toast(t("toastReactivatedRoom")); });
      });

      $("#btn-send").addEventListener("click", sendChat);
      $("#chat-input").addEventListener("input", function (e) {
        autoGrow(e.target);
        var room = state.currentRoom;
        if (room) {
          var v = e.target.value;
          if (v) state.ui.drafts[room.id] = v;
          else delete state.ui.drafts[room.id];
          saveUIDebounced();
        }
      });
      $("#chat-input").addEventListener("keydown", function (e) {
        if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendChat(); }
      });
      window.addEventListener("scroll", function () {
        var room = state.currentRoom;
        if (room && state.currentTab === "chat" && !state.suppressAutoScroll) {
          state.ui.scrolls[room.id] = window.scrollY;
          saveUIDebounced();
        }
      }, { passive: true });
      window.addEventListener("resize", closeMenu);
      /* عودة الشبكة أو رجوع التبويب للمقدمة = إعادة اتصال فورية بدل الانتظار */
      window.addEventListener("online", function () { retryP2PNow(); });
      document.addEventListener("visibilitychange", function () { if (!document.hidden) retryP2PNow(); });
      var presEl = document.querySelector("#view-room .presence");
      if (presEl) {
        presEl.style.cursor = "pointer";
        presEl.addEventListener("click", function () { retryP2PNow(); });
      }
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") { closeMenu(); closeModals(); }
      });
      $("#btn-attach").addEventListener("click", function () { $("#chat-file").click(); });
      $("#chat-file").addEventListener("change", function (e) {
        var f = e.target.files && e.target.files[0];
        if (!f) return;
        if (f.size > 30 * 1024 * 1024) { toast(t("toastFileTooBig")); e.target.value = ""; return; }
        state.pendingFile = f;
        $("#pending-file-name").textContent = t("pendingFileTxt", { name: f.name, size: fmtSize(f.size) });
        $("#pending-file").classList.add("show");
      });
      $("#pending-file-clear").addEventListener("click", clearPendingFile);

      $("#task-form").addEventListener("submit", function (e) {
        e.preventDefault();
        var room = state.currentRoom; if (!room || room.archived) return;
        var title = $("#task-title").value.trim();
        if (!title) { toast(t("toastTaskTitleReq")); return; }
        var tk = { id: uid(), roomId: room.id, title: title, desc: $("#task-desc").value.trim(), due: $("#task-due").value || "", done: false, author: myName(), authorId: state.myId, ts: Date.now() };
        state.tasks.push(tk);
        $("#task-title").value = ""; $("#task-desc").value = ""; $("#task-due").value = "";
        idbPut("tasks", tk).then(function () { touchRoom(room); });
        renderTasks(); updateBadges();
        emitEvent({ type: "task-add", task: tk });
        toast(t("toastTaskAdded"));
      });

      $("#import-file").addEventListener("change", function (e) {
        if (e.target.files && e.target.files[0]) importBackup(e.target.files[0]);
        e.target.value = "";
      });
    }
    function updateNotifyLabel() {
      var el = $("#notify-label");
      if (el && "Notification" in window) {
        el.textContent = Notification.permission === "granted" ? t("notifyEnabled") : t("notifyOn");
      }
    }
    function copyCode(code) {
      function done() { toast(t("toastCodeCopied", { code: code })); }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(code).then(done).catch(function () { fallback(); });
      } else fallback();
      function fallback() {
        var ta = document.createElement("textarea");
        ta.value = code; document.body.appendChild(ta); ta.select();
        try { document.execCommand("copy"); done(); } catch (e) { toast(t("toastCodeFallback") + code); }
        ta.remove();
      }
    }

    /* ---------------- البدء ---------------- */
    openDB().then(function () {
      return loadMeta();
    }).then(function () {
      applyTheme();
      bindEvents();
      applyLang();
      return loadRooms();
    }).then(function () {
      if (!handleInviteHash() && state.ui.lastRoomId) {
        var room = getRoom(state.ui.lastRoomId);
        if (room) openRoom(room);
      }
    }).catch(function () {
      toast(t("toastStorageErr"));
    });
    </script>
  </body>
</html>
