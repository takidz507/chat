<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>🚀 دردشة لا مركزية</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f7f9fc;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background: #4a90e2;
      color: white;
      padding: 15px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }
    #chat-box {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }
    .msg {
      margin: 5px 0;
      padding: 10px;
      border-radius: 8px;
      max-width: 70%;
      word-wrap: break-word;
    }
    .me {
      align-self: flex-end;
      background: #4a90e2;
      color: white;
    }
    .other {
      align-self: flex-start;
      background: #e0e0e0;
    }
    footer {
      display: flex;
      padding: 10px;
      background: #fff;
      border-top: 1px solid #ddd;
    }
    input, button {
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 16px;
    }
    #name {
      width: 25%;
      margin-right: 5px;
    }
    #msg {
      flex: 1;
      margin-right: 5px;
    }
    button {
      background: #4a90e2;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background: #357ABD;
    }

    /* Responsive */
    @media (max-width: 600px) {
      #name {
        display: none;
      }
      footer {
        flex-direction: row;
      }
      #msg {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <header>🚀 دردشة لا مركزية</header>
  <div id="chat-box"></div>
  <footer>
    <input id="name" placeholder="اسمك">
    <input id="msg" placeholder="اكتب رسالة...">
    <button onclick="send()">إرسال</button>
  </footer>

  <script>
    const gun = Gun(); // قاعدة بيانات لا مركزية
    const messages = gun.get('chat-room');

    function send() {
      const name = document.getElementById('name').value || "مجهول";
      const msg = document.getElementById('msg').value.trim();
      if (msg === "") return;
      messages.set({ name, msg, time: Date.now() });
      document.getElementById('msg').value = "";
    }

    messages.map().on(data => {
      if (!data || !data.name || !data.msg) return;
      const chatBox = document.getElementById('chat-box');
      const div = document.createElement('div');
      div.className = "msg " + (data.name === document.getElementById('name').value ? "me" : "other");
      div.textContent = data.name + ": " + data.msg;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    });
  </script>
</body>
</html>
